<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warung Masak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="stat">📅 Hari <b id="day">1</b></div>
    <div class="stat">⏱️ <b id="time">0</b> dtk</div>
    <div class="stat">💰 Rp <b id="money">0</b>rb</div>
    <div class="stat">⭐ <b id="rating">5.0</b></div>
  </header>

  <main>
    <section class="panel">
      <h2>Pelanggan</h2>
      <div id="customers" class="customers"></div>
    </section>

    <section class="panel">
      <h2>Siap saji</h2>
      <p class="hint">Klik makanan/minuman, lalu klik pelanggan yang memesannya.</p>
      <div id="ready" class="row"></div>
    </section>

    <section class="panel">
      <h2>Dapur</h2>
      <p class="hint">Klik bahan untuk masuk ke piring, lalu tekan Masak.</p>
      <div id="shelf" class="row"></div>
      <div id="plate" class="plate"></div>
      <div class="bar"><div id="cookbar"></div></div>
      <div class="actions">
        <button id="cookBtn" class="btn primary">🔥 Masak</button>
        <button id="clearBtn" class="btn">🗑️ Buang bahan</button>
      </div>
      <p id="msg" class="msg">&nbsp;</p>
    </section>

    <section class="panel">
      <h2>Buku resep</h2>
      <ul id="recipes" class="recipes"></ul>
    </section>
  </main>

  <div id="overlay" class="overlay">
    <div id="card" class="card"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>

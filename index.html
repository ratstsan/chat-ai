<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat dengan Erine</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #e5ddd5; height: 100vh; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; background: #efeae2; }

    header { background: #075e54; color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #ffb6c1; display: grid; place-items: center; font-size: 20px; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .info { flex: 1; }
    .name { font-weight: 600; }
    .status { font-size: 12px; opacity: .85; }
    #reset { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; opacity: .7; }
    #reset:hover { opacity: 1; }
    .progress { height: 3px; background: #0a4a42; }
    #bar { height: 100%; width: 0%; background: #ffb6c1; transition: width .4s; }

    #chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
    .bubble { max-width: 78%; padding: 7px 10px 5px; border-radius: 10px; font-size: 15px; line-height: 1.35; word-wrap: break-word; white-space: pre-wrap; box-shadow: 0 1px 1px rgba(0,0,0,.12); }
    .bubble .time { display: block; text-align: right; font-size: 10px; color: #888; margin-top: 2px; }
    .bubble img { max-width: 100%; border-radius: 8px; display: block; margin-bottom: 2px; }
    .ai { background: #fff; align-self: flex-start; border-top-left-radius: 2px; }
    .user { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 2px; }
    .error { align-self: center; background: #fde2e2; color: #a33; font-size: 12px; padding: 4px 10px; border-radius: 8px; }

    .typing { display: flex; gap: 4px; padding: 12px 14px; }
    .typing span { width: 7px; height: 7px; background: #999; border-radius: 50%; animation: bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }

    #form { display: flex; gap: 8px; padding: 8px; background: #f0f0f0; }
    #input { flex: 1; padding: 10px 14px; border: none; border-radius: 20px; font-size: 15px; outline: none; }
    #send { width: 42px; height: 42px; border: none; border-radius: 50%; background: #075e54; color: #fff; font-size: 18px; cursor: pointer; }
    #send:disabled { opacity: .5; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar" id="avatar">👩</div>
      <div class="info">
        <div class="name">Erine</div>
        <div class="status" id="status">online</div>
      </div>
      <button id="reset" title="Mulai dari awal">↺</button>
    </header>
    <div class="progress"><div id="bar"></div></div>
    <div id="chat"></div>
    <div id="form">
      <input id="input" placeholder="Ketik pesan..." autocomplete="off" />
      <button id="send">➤</button>
    </div>
  </div>

  <script>
    // ====== PENGATURAN (edit di sini) ======
    const PHOTOS = {
      makan: "images/makan.jpg",
      kucing: "images/kucing.jpg",
      selfie: "images/selfie.jpg",
      kampus: "images/kampus.jpg",
    };
    const STAGE_AT = [0, 8, 20, 40];   // jumlah chat kamu untuk masuk tahap 1, 2, 3, 4
    const STAGE_NAMES = ["baru kenalan", "mulai akrab", "teman dekat", "sahabat"];
    const IDLE_MIN = 60;               // detik, paling cepat Erine mulai duluan
    const IDLE_MAX = 150;              // detik, paling lama
    const MAX_NUDGES = 1;              // maksimal Erine mulai duluan berturut-turut
    const MAX_BUBBLES = 2;             // maksimal gelembung per balasan
    const STORAGE_KEY = "erine_state_v1";
    // =======================================

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const barEl = document.getElementById("bar");

    const history = [];
    let count = 0;        // jumlah chat dari user (penentu tahap kedekatan)
    let busy = false;
    let idleTimer = null;
    let nudges = 0;

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const nowTime = () => new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });

    // ---------- Tahap kedekatan & penyimpanan ----------
    function getStage() {
      let s = 1;
      STAGE_AT.forEach((n, i) => { if (count >= n) s = i + 1; });
      return s;
    }

    function updateProgressUI() {
      const stage = getStage();
      statusEl.textContent = "online · " + STAGE_NAMES[stage - 1];
      const max = STAGE_AT[STAGE_AT.length - 1];
      barEl.style.width = Math.min(count / max, 1) * 100 + "%";
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ count, history: history.slice(-40) }));
      } catch (e) {}
    }

    function load() {
      try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (s) {
          count = s.count || 0;
          history.push(...(s.history || []));
        }
      } catch (e) {}
    }

    // ---------- Waktu balas acak ----------
    function randomDelay() {
      const r = Math.random();
      if (r < 0.55) return 800 + Math.random() * 2200;    // 55% cepat: 0,8-3 detik
      if (r < 0.90) return 3000 + Math.random() * 7000;   // 35% sedang: 3-10 detik
      return 10000 + Math.random() * 15000;               // 10% lama: 10-25 detik
    }

    // ---------- Tampilan ----------
    function scrollDown() { chat.scrollTop = chat.scrollHeight; }

    function addBubble(text, who, photoSrc) {
      const div = document.createElement("div");
      div.className = "bubble " + who;
      if (photoSrc) {
        const img = document.createElement("img");
        img.src = photoSrc;
        img.onerror = () => img.remove(); // kalau foto tidak ada, abaikan
        div.appendChild(img);
      }
      if (text) div.appendChild(document.createTextNode(text));
      const t = document.createElement("span");
      t.className = "time";
      t.textContent = nowTime();
      div.appendChild(t);
      chat.appendChild(div);
      scrollDown();
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "bubble ai typing";
      div.innerHTML = "<span></span><span></span><span></span>";
      chat.appendChild(div);
      statusEl.textContent = "mengetik...";
      scrollDown();
      return div;
    }

    // Pecah balasan AI jadi maksimal MAX_BUBBLES gelembung
    function parseReply(reply) {
      let parts = reply.split("|||").map((p) => p.trim()).filter(Boolean);
      if (parts.length > MAX_BUBBLES) {
        parts = [...parts.slice(0, MAX_BUBBLES - 1), parts.slice(MAX_BUBBLES - 1).join(" ")];
      }
      return parts.map((part) => {
        const match = part.match(/\[foto:(\w+)\]/);
        return {
          text: part.replace(/\[foto:\w+\]/g, "").trim(),
          photo: match ? PHOTOS[match[1]] : null,
        };
      });
    }

    async function showReply(reply) {
      for (const p of parseReply(reply)) {
        const typing = showTyping();
        await sleep(Math.min(500 + p.text.length * 30, 3500));
        typing.remove();
        updateProgressUI();
        addBubble(p.text, "ai", p.photo);
        await sleep(300);
      }
    }

    // Tampilkan ulang riwayat tersimpan saat halaman dibuka lagi
    function restoreChat() {
      for (const m of history) {
        if (m.role === "user") {
          if (!m.content.startsWith("[SISTEM:")) addBubble(m.content, "user");
        } else {
          for (const p of parseReply(m.content)) addBubble(p.text, "ai", p.photo);
        }
      }
    }

    // ---------- Komunikasi dengan AI ----------
    async function askAI(skipDelay = false) {
      busy = true;
      sendBtn.disabled = true;
      clearTimeout(idleTimer);
      const started = Date.now();
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history, stage: getStage() }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        history.push({ role: "assistant", content: data.reply });
        save();

        if (!skipDelay) {
          const wait = Math.max(0, randomDelay() - (Date.now() - started));
          await sleep(wait);
        }
        await showReply(data.reply);
      } catch (e) {
        history.pop();
        save();
        const err = document.createElement("div");
        err.className = "error";
        err.textContent = "Error: " + e.message.slice(0, 150);
        chat.appendChild(err);
        scrollDown();
      }
      updateProgressUI();
      busy = false;
      sendBtn.disabled = false;
      startIdleTimer();
    }

    // Pesan tersembunyi: user tidak melihatnya, hanya AI
    function hiddenPrompt(text, skipDelay = false) {
      history.push({ role: "user", content: "[SISTEM: " + text + "]" });
      return askAI(skipDelay);
    }

    function startIdleTimer() {
      clearTimeout(idleTimer);
      if (nudges >= MAX_NUDGES) return;
      const seconds = IDLE_MIN + Math.random() * (IDLE_MAX - IDLE_MIN);
      idleTimer = setTimeout(() => {
        if (busy || input.value.trim()) return startIdleTimer();
        nudges++;
        hiddenPrompt(
          "User sudah lama tidak membalas. Kalau topik tadi masih menggantung, lanjutkan dengan satu pesan pendek yang sesuai tahap kedekatanmu. Kalau topik sudah selesai, boleh buka topik baru yang ringan. Jangan menyebut kata 'diam' atau 'sistem'."
        );
      }, seconds * 1000);
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || busy) return;
      input.value = "";
      nudges = 0;
      count++;
      addBubble(text, "user");
      history.push({ role: "user", content: text });
      save();
      await askAI();
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
    input.addEventListener("input", () => { if (!busy) startIdleTimer(); });
    document.getElementById("reset").addEventListener("click", () => {
      if (confirm("Mulai dari awal? Obrolan dan tingkat kedekatan akan dihapus.")) {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        location.reload();
      }
    });

    // ---------- Mulai ----------
    load();
    updateProgressUI();
    if (history.length === 0) {
      // obrolan baru: Erine menyapa duluan sebagai orang asing
      hiddenPrompt(
        "Ini awal obrolan dan kamu belum kenal user sama sekali. Sapa duluan dengan canggung tapi ramah, sebutkan namamu Erine, lalu tanya namanya. Cukup 1 pesan singkat.",
        true
      );
    } else {
      restoreChat();
      startIdleTimer();
    }
  </script>
</body>
</html>
